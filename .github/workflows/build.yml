name: Build Thaker APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Generate Native Platforms
      run: flutter create --project-name thaker --platforms=android .

    - name: Configure Android Permissions & Gradle
      run: |
        # 1. إضافة صلاحيات الإنترنت والمنبهات في AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

        # 2. ضبط minSdk إلى 21
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

        # 3. منع تعارض كوتلن
        cat << 'GRADLE_EOF' >> android/app/build.gradle

        configurations.all {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
            }
        }
        GRADLE_EOF

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Build Runner
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Thaker-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
